name: Bug report
description: Report a reproducible problem in the developer preview.
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, personal paths, or unredacted logs.
        Report vulnerabilities privately through Security > Report a vulnerability, not this form.
        Support is best effort; the developer preview is not production certified.
  - type: input
    id: version
    attributes:
      label: Application version or source revision
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic names and disposable test data. Do not paste SAS URLs or account keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted error text and whether the connection was read-only or writable. Preserve any uncertain cache.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked this report for secrets, private identifiers, customer content, and personal paths.
          required: true